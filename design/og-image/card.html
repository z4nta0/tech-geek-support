<!doctype html><!-- What: Document Type Declaration. Why: Browsers render the page in standards mode only with a doctype. How: This declares HTML5. -->



<html lang='en'><!-- What: Root HTML Element. Why: The card is set in English text. How: This marks the document as English. -->


	<head><!-- What: Document Head Element. Why: The card's fonts and layout load before it's captured. How: This holds them in the sections below. -->


		<!-- #region Document -->

		<meta charset='UTF-8' />                            <!-- What: Character Set Meta. Why: The card's text has to decode as UTF-8. How: This sits first in the head. -->
		<title>TechGeek.support Social Preview Card</title> <!-- What: Page Title Element. Why: The file should say what it is when opened in a browser. How: This names the card. -->

		<!-- #endregion Document -->


		<!-- #region Card Styles -->

		<style>/* What: Card Style Element. Why: The card is one fixed-size image, styled here from the site's own fonts and tokens. How: This imports the shared package's font faces, tokens, and base styles and the site's own global stylesheet, then lays out the card. */


			@import url( '../../node_modules/techgeek-design/src/styles/fonts.css' );  /* What: Package Fonts Import. Why: The card should be set in the family's own typefaces. How: This loads the shared package's font faces, whose file paths resolve from that stylesheet's own folder. */
			@import url( '../../node_modules/techgeek-design/src/styles/tokens.css' ); /* What: Package Tokens Import. Why: The card should read the family's colors and scale rather than copies of them. How: This loads the shared tokens. */
			@import url( '../../node_modules/techgeek-design/src/styles/base.css' );   /* What: Package Base Import. Why: The rem steps assume the family's 11px root. How: This loads the shared base styles, which set it. */
			@import url( '../../src/styles/styles.css' );                              /* What: Site Styles Import. Why: The card should match the site's own overrides, its teal accent included. How: This loads the site's global stylesheet last, as the site does. */



			/* #region carBodBod */

			.carBodBod { /* What: Card Body Body. Why: The card fills the whole 1,200x630 capture on the site's ivory page color. How: This sizes it in literal pixels, the image's own fixed size, and centers its column both ways. */


				align-items     : center;
				background      : var( --bac-pag-col ); /* Background Page Color = #F5F0E8 */
				display         : flex;
				height          : 630px;
				justify-content : center;
				overflow        : hidden;
				position        : relative;
				width           : 1200px;


			}


			/* #region sigRinSvg */

			.sigRinSvg { /* What: Signal Rings SVG. Why: The site's rings make the card recognizable, outside the center square some apps crop to. How: This pins the drawing to one side, centered top to bottom, sized by its modifier. */


				position  : absolute;
				top       : 50%;
				translate : 0 -50%;


			}
			.sigRinSvg--lef { /* What: Left Signal Rings SVG. Why: The full drawing, bubble and all, sits on the left. How: This sizes it at the p11 rhythm step, a spacing step in from the left edge. */


				height : calc( var( --ver-rhy-p11 ) * 1rem ); /* Vertical Rhythm Base Plus 11 ~= 321.273px */
				left   : calc( var( --spa-hor-p01 ) * -1 );   /* Spacing Horizontal Base Plus 1 ~= -19.304px */
				width  : calc( var( --ver-rhy-p11 ) * 1rem ); /* Vertical Rhythm Base Plus 11 ~= 321.273px */


			}
			.sigRinSvg--rig { /* What: Right Signal Rings SVG. Why: An echo of the rings balances the drawing on the left. How: This sizes the rings alone at the p12 rhythm step, half of them running off the right edge. */


				height : calc( var( --ver-rhy-p12 ) * 1rem );      /* Vertical Rhythm Base Plus 12 ~= 425.590px */
				right  : calc( var( --ver-rhy-p12 ) * 1rem / -2 ); /* Vertical Rhythm Base Plus 12 ~= -212.795px */ /* What: Half Width Offset. Why: Half the echo should run off the edge, so only its left arcs show. How: This offsets it by half its own width. */
				width  : calc( var( --ver-rhy-p12 ) * 1rem );      /* Vertical Rhythm Base Plus 12 ~= 425.590px */


			}

			.rinOutCir,
			.rinMidCir,
			.rinInnCir { /* What: Ring Circles. Why: The rings are thin teal lines, as on the site. How: This outlines each in the teal at the site's own strengths, set by each ring's rule. */


				fill         : none;
				stroke       : var( --act-mai-col ); /* Accent-Tertiary Main Color = #2A9D8F */
				stroke-width : 2;                    /* What: Ring Stroke Width. Why: The rings are thin, quiet lines. How: This is 2 units of the 400-unit drawing space. */


			}

			.rinOutCir { /* What: Ring Outer Circle. Why: The outermost ring is the faintest. How: This sets it at about 11% strength, as on the site. */


				opacity : var( --cdn-pow-008-rec ); /* Core-Design-Number to the Power of 8 Reciprocal ~= 0.105 */


			}

			.rinMidCir { /* What: Ring Middle Circle. Why: The middle ring sits between the other two in strength. How: This sets it at about 19% strength, as on the site. */


				opacity : var( --cdn-pow-006-rec ); /* Core-Design-Number to the Power of 6 Reciprocal ~= 0.185 */


			}

			.rinInnCir { /* What: Ring Inner Circle. Why: The ring nearest the bubble is the strongest. How: This sets it at about 33% strength, as on the site. */


				opacity : var( --cdn-pow-004-rec ); /* Core-Design-Number to the Power of 4 Reciprocal ~= 0.325 */


			}

			.corTinCir { /* What: Core Tint Circle. Why: The bubble sits on a calm pool of color. How: This fills the circle with the pale teal. */


				fill : var( --act-tin-col ); /* Accent-Tertiary Tint Color = #D3EEE9 */


			}

			.bubOutPat { /* What: Bubble Outline Path. Why: The speech bubble is the drawing's center of attention. How: This fills it white with an ink outline and rounded joins. */


				fill            : var( --bac-sur-col ); /* Background Surface Color = #FFFFFF */
				stroke          : var( --tex-mai-col ); /* Text Main Color = #1A1A2E */
				stroke-linejoin : round;
				stroke-width    : 3;                    /* What: Bubble Stroke Width. Why: The bubble's outline is a little bolder than the rings, so it reads first. How: This is 3 units of the 400-unit drawing space. */


			}

			.bubDotCir { /* What: Bubble Dot Circle. Why: The typing dots read in ink inside the white bubble. How: This fills each dot with the main text color. */


				fill : var( --tex-mai-col ); /* Text Main Color = #1A1A2E */


			}

			.spaOraPat { /* What: Sparkle Orange Path. Why: The sparkle is the drawing's touch of fun. How: This fills it orange. */


				fill : var( --acc-mai-col ); /* Accent Main Color = #F26419 */


			}

			.dotBluCir { /* What: Dot Blue Circle. Why: A small dot in the family's blue balances the orange sparkle. How: This fills it with the secondary accent. */


				fill : var( --acc-sec-col ); /* Accent Secondary Color = #7DB9D8 */


			}

			/* #endregion sigRinSvg */



			/* #region carColDiv */

			.carColDiv { /* What: Card Column Div. Why: Some apps crop the card to its center square, so everything that matters sits inside the middle 630px. How: This stacks the card's lines in one centered column, capped at that width. */


				align-items    : center;
				display        : flex;
				flex-direction : column;
				gap            : var( --spa-ver-bas ); /* Spacing Vertical Base ~= 14.572px */
				max-width      : 630px;
				position       : relative;
				text-align     : center;


			}

			.hexMarIma { /* What: Hexagon Mark Image. Why: The site's hexagon mark makes the card recognizable at a glance. How: This sizes the mark at the p08 rhythm step, large enough to lead the column. */


				display       : block;
				height        : calc( var( --ver-rhy-p08 ) * 1rem ); /* Vertical Rhythm Base Plus 8 ~= 138.199px */
				margin-bottom : var( --spa-ver-bas );                /* Spacing Vertical Base ~= 14.572px */
				width         : calc( var( --ver-rhy-p08 ) * 1rem ); /* Vertical Rhythm Base Plus 8 ~= 138.199px */


			}

			.topLabPar { /* What: Topic Label Paragraph. Why: An article's card says which topic it belongs to before its title. How: This sets the topic in the accent serif's italic in the teal text shade. */


				color       : var( --act-dar-col ); /* Accent-Tertiary Dark Color ~= #007063 */
				font-family : var( --fon-fam-acc ); /* Font Family Accent = 'Lora', serif */
				font-size   : var( --fon-siz-p05 ); /* Font Size Base Plus 5 ~= 44.876px */
				font-style  : italic;
				line-height : var( --ver-rhy-m01 ); /* Vertical Rhythm Base Minus 1 = 1 */


			}

			.artTitHea { /* What: Article Title Heading. Why: An article's title is its card's main line, large enough to read at thumbnail size. How: This sets it bold in the display font in the ink, a little tight, wrapping evenly, with room below so the wordmark reads as a sign-off. */


				color          : var( --tex-mai-col );                    /* Text Main Color = #1A1A2E */
				font-family    : var( --fon-fam-mai );                    /* Font Family Main = 'Syne', sans-serif */
				font-size      : var( --fon-siz-p05 );                    /* Font Size Base Plus 5 ~= 44.876px */
				font-weight    : 800;
				letter-spacing : calc( var( --cdn-pow-014-rec ) * -1em ); /* Core-Design-Number to the Power of 14 Reciprocal ~= -0.020em */
				line-height    : var( --ver-rhy-m01 );                    /* Vertical Rhythm Base Minus 1 = 1 */
				margin         : 0 0 var( --spa-ver-p03 );                /* Spacing Vertical Base Plus 3 ~= 33.876px */
				text-wrap      : balance;


			}


			/* #region braWorPar */

			.braWorPar { /* What: Brand Wordmark Paragraph. Why: The site's name reads in the column, set as the bar sets it. How: This sets it bold in the display font, a little tight, at the p05 step. */


				font-family    : var( --fon-fam-mai ); /* Font Family Main = 'Syne', sans-serif */
				font-size      : var( --fon-siz-p05 ); /* Font Size Base Plus 5 ~= 44.876px */
				font-weight    : 800;
				letter-spacing : -0.03em;
				line-height    : var( --ver-rhy-m01 ); /* Vertical Rhythm Base Minus 1 = 1 */


			}

			.worFirSpa { /* What: Wordmark First Span. Why: The brand reads in the main text color, as in the bar. How: This sets TechGeek in the ink. */


				color : var( --tex-mai-col ); /* Text Main Color = #1A1A2E */


			}

			.worLasSpa { /* What: Wordmark Last Span. Why: The domain ending carries the accent, as in the bar. How: This sets .support in the dark orange. */


				color : var( --acc-dar-col ); /* Accent Dark Color ~= #bd3000 */


			}

			/* #endregion braWorPar */


			.tagLinPar { /* What: Tag Line Paragraph. Why: The site's card says what the site offers, large enough to read at thumbnail size and set apart from the wordmark. How: This sets it in the accent serif's italic in the teal text shade. */


				color       : var( --act-dar-col ); /* Accent-Tertiary Dark Color ~= #007063 */
				font-family : var( --fon-fam-acc ); /* Font Family Accent = 'Lora', serif */
				font-size   : var( --fon-siz-p05 ); /* Font Size Base Plus 5 ~= 44.876px */
				font-style  : italic;
				line-height : var( --ver-rhy-m01 ); /* Vertical Rhythm Base Minus 1 = 1 */


			}

			/* #endregion carColDiv */

			/* #endregion carBodBod */


		</style>

		<!-- #endregion Card Styles -->


	</head>



	<body class='carBodBod'><!-- What: Card Body Body Element. Why: The card fills the capture. How: This holds the two ring drawings and the center column. -->


		<svg
			class='sigRinSvg sigRinSvg--lef'

			viewBox='0 0 400 400'
		><!-- What: Signal Rings SVG Element. Why: The site's motif leads the card from the left. How: This draws the rings, the bubble, the sparkle, and the dot on the site's 400-unit grid. -->


			<circle
				class='rinOutCir'

				cx='200'
				cy='200'
				r='190'
			/><!-- What: Ring Outer Circle Element. Why: The signal's faintest ring reaches furthest. How: This draws the outer ring. -->

			<circle
				class='rinMidCir'

				cx='200'
				cy='200'
				r='150'
			/><!-- What: Ring Middle Circle Element. Why: The signal grows stronger toward the bubble. How: This draws the middle ring. -->

			<circle
				class='rinInnCir'

				cx='200'
				cy='200'
				r='110'
			/><!-- What: Ring Inner Circle Element. Why: The ring nearest the bubble is the strongest. How: This draws the inner ring. -->

			<circle
				class='corTinCir'

				cx='200'
				cy='200'
				r='72'
			/><!-- What: Core Tint Circle Element. Why: The bubble sits on a calm pool of color. How: This draws a filled pale teal circle. -->

			<path
				class='bubOutPat'

				d='M 170 186 H 230 A 10 10 0 0 1 240 196 V 222 A 10 10 0 0 1 230 232 H 200 L 186 244 V 232 H 170 A 10 10 0 0 1 160 222 V 196 A 10 10 0 0 1 170 186 Z'
			/><!-- What: Bubble Outline Path Element. Why: A speech bubble says a person is there to talk to. How: This draws the site's rounded bubble with a tail at its lower left. -->

			<circle
				class='bubDotCir'

				cx='186'
				cy='209'
				r='3.5'
			/><!-- What: Bubble Dot Circle Element. Why: Three dots read as someone typing a reply. How: This draws the first dot. -->

			<circle
				class='bubDotCir'

				cx='200'
				cy='209'
				r='3.5'
			/><!-- What: Bubble Dot Circle Element. Why: Three dots read as someone typing a reply. How: This draws the second dot. -->

			<circle
				class='bubDotCir'

				cx='214'
				cy='209'
				r='3.5'
			/><!-- What: Bubble Dot Circle Element. Why: Three dots read as someone typing a reply. How: This draws the third dot. -->

			<path
				class='spaOraPat'

				d='M 326 96 L 332 110 L 346 116 L 332 122 L 326 136 L 320 122 L 306 116 L 320 110 Z'
			/><!-- What: Sparkle Orange Path Element. Why: A sparkle adds the touch of fun. How: This draws the site's four-pointed orange star near the outer ring. -->

			<circle
				class='dotBluCir'

				cx='88'
				cy='300'
				r='6'
			/><!-- What: Dot Blue Circle Element. Why: A small blue dot balances the sparkle and brings in the family's blue. How: This draws it across from the sparkle. -->


		</svg>


		<div class='carColDiv'><!-- What: Card Column Div Element. Why: The card's lines lead it in its center square. How: This stacks them in one centered column, the site's lines or an article's, as the capture script fills it. -->


			<img
				class='hexMarIma'

				data-site-only

				src='../../node_modules/techgeek-design/src/assets/brand/favicon.svg'

				alt=''
			/><!-- What: Hexagon Mark Image Element. Why: The family's hexagon mark leads the site's card. How: This shows the shared mark, with an empty alt since the wordmark names the site, and the capture script removes it from an article's card. -->

			<p
				class='topLabPar'

				data-article-only
				data-element-name-hook='topLabPar'
			></p><!-- What: Topic Label Paragraph Element. Why: An article's card names its topic first. How: The capture script fills it, and removes it from the site's card. -->

			<h1
				class='artTitHea'

				data-article-only
				data-element-name-hook='artTitHea'
			></h1><!-- What: Article Title Heading Element. Why: An article's card leads with its title. How: The capture script fills it, and removes it from the site's card. -->

			<p class='braWorPar'><span class='worFirSpa'>TechGeek</span><span class='worLasSpa'>.support</span></p><!-- What: Brand Wordmark Paragraph Element. Why: The site's name reads on every card. How: This sets TechGeek in ink and .support in orange. -->

			<p
				class='tagLinPar'

				data-site-only
			>Free, Friendly Tech Help</p><!-- What: Tag Line Paragraph Element. Why: The site's card says what the site offers. How: This sets it in teal italic under the name, and the capture script removes it from an article's card. -->


		</div>


		<svg
			class='sigRinSvg sigRinSvg--rig'

			viewBox='0 0 400 400'
		><!-- What: Signal Rings SVG Element. Why: An echo of the rings balances the card on the right. How: This draws the three rings alone, running off the edge. -->


			<circle
				class='rinOutCir'

				cx='200'
				cy='200'
				r='190'
			/><!-- What: Ring Outer Circle Element. Why: The echo keeps the rings' rhythm. How: This draws the outer ring. -->

			<circle
				class='rinMidCir'

				cx='200'
				cy='200'
				r='150'
			/><!-- What: Ring Middle Circle Element. Why: The echo keeps the rings' rhythm. How: This draws the middle ring. -->

			<circle
				class='rinInnCir'

				cx='200'
				cy='200'
				r='110'
			/><!-- What: Ring Inner Circle Element. Why: The echo keeps the rings' rhythm. How: This draws the inner ring. -->


		</svg>


	</body>


</html>
